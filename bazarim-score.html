<!DOCTYPE html>
<html lang="pt-BR" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bazarim Score | Victor Queiroz Bazarim</title>
  <meta name="description" content="O Bazarim Score agora fica na seção de Projetos da página inicial.">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=index.html#portfolio">
  <meta name="theme-color" content="#14171c">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Bazarim Score | Victor Queiroz Bazarim">
  <meta property="og:description" content="O Bazarim Score agora fica na seção de Projetos da página inicial.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* Aplica tema e idioma salvos antes de desenhar a página (sem "piscar") */
    (function (h) {
      h.className = h.className.replace('no-js', 'js');
      try {
        if (localStorage.getItem('vb-tema') === 'claro') {
          h.setAttribute('data-theme', 'light');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#fbfaf7');
        }
        if (localStorage.getItem('vb-idioma') === 'en') {
          h.lang = 'en';
          h.classList.add('i18n-pending');
          setTimeout(function () { h.classList.remove('i18n-pending'); }, 1500);
        }
      } catch (e) { /* navegador sem localStorage: mantém o padrão */ }
    })(document.documentElement);
  </script>
  <script src="js/i18n-en.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<!--
  O Bazarim Score deixou de ser uma página e virou um selo no topo de Projetos,
  na página inicial. Este arquivo só redireciona quem chegar pelo endereço antigo.
-->
<body>
  <main class="redirect">
    <p>O Bazarim Score agora fica na seção de Projetos da página inicial.</p>
    <a class="btn btn--primary" href="index.html#portfolio">Ver projetos</a>
  </main>
</body>
</html>
